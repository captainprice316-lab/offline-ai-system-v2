device: cuda         # Windows RTX 5060 — CUDA for transformers models; CT2/faster-whisper also uses CUDA

# ── Model paths (relative to project root) ────────────────────────────────────
paths:
  whisper_model:      models/whisper-large-v3-turbo-ct2
  indictrans_model:   models/indictrans2-indic-en-1B
  nllb_model:         models/nllb-200-distilled-600M
  fasttext_model:     models/langid/lid.176.bin
  mms_lid_model:      models/mms-lid-256             # auto-used if directory exists
  seamless_model:     models/seamless-m4t-v2-large   # zero-shot ASR backend for pa/ne
  qwen_model:         models/qwen2.5-1.5b-instruct   # auto-used if directory exists (download with: python download_models.py qwen)
  whisper_model_pa:   models/whisper-large-v3-pa-ct2               # Punjabi  — fine-tuned large-v3; outputs Gurmukhi (tokenizer fix 2026-06-23 restored correct task token)
  whisper_model_zh:   models/whisper-large-v3-zh-ct2              # Mandarin — fine-tuned large-v3; eval WER 8.97% at step 400 (best ckpt)
  whisper_model_ps:   models/whisper-medium-pashto-ct2            # Pashto   — auto-selected by MMS-LID; download with: python download_lang_models.py ps
  whisper_model_ur:   models/whisper-large-v3-ur-ct2             # Urdu     — fine-tuned large-v3; eval WER 22.3% vs baseline ~74%
  whisper_model_ne:   models/whisper-large-v3-ne-ct2             # Nepali   — fine-tuned large-v3; eval WER 54.4% vs baseline ~74%
  whisper_model_hi:   models/whisper-large-v3-hi-ct2             # Hindi    — fine-tuned large-v3; eval WER 23.1% vs baseline ~75%
  whisper_model_ks:   models/whisper-large-v3-ks-ct2             # Kashmiri — fine-tuned large-v3; IndicVoices 20k samples, whisper_lang=ur proxy; best eval_loss=0.9356 (ckpt-1500)
  keyword_dictionary: alerts/keyword_dictionary.json
  input_dir:          input_audio
  output_dir:         output
  log_dir:            logs
  database:           database/transcripts.db

# ── ASR tuning ─────────────────────────────────────────────────────────────────
asr:
  beam_size: 5   # raised from 2 (2026-07-06) — beam 2 was a CPU-era speed compromise;
                 # published eval WERs were measured at beam 5, ASR now runs on GPU
  best_of: 1
  seamless_langs: [pa, ne, hi, ur, zh]   # route these to zero-shot SeamlessM4T ASR.
                             # Corrected n=100 eval (2026-07-11): zero-shot Seamless beats
                             # fine-tuned Whisper on WER for all five, and holds under
                             # bandpass/noise (robustness sweep). Numbers (whisper_ft -> seamless):
                             #   pa 57.4->19.8  ne 50.9->28.5  hi 19.8->15.4  ur 19.8->16.9  zh 14.2->11.7
                             # Whisper KEEPS ps (38.6, beats Seamless 44.4) and ks (no Seamless support).
                             # Empty the list to fall back to Whisper for all langs.
  seamless_adapters:         # per-language LoRA adapters on the shared SeamlessM4T model.
                             # An adapter is enabled ONLY for that language's generate()
                             # calls; every other language runs with adapters disabled,
                             # numerically identical to the plain base model.
    hi: finetune_runs_seamless/hi_iv/adapter
                             # hi_iv (deployed 2026-07-18, replaces the 2026-07-13 hi
                             # adapter): FLEURS + IndicVoices-R (cap 20k). 12.91 vs prior
                             # adapter 13.94 vs zero-shot 15.44 WER (n=100 clean); beats
                             # the prior adapter in 4/5 degradation conditions (30-clip
                             # sweep, e.g. bandpass 15.0 vs 16.3). Previous adapter kept
                             # at finetune_runs_seamless/hi/adapter for rollback.
    ne: finetune_runs_seamless/ne_iv/adapter
                             # ne_iv (deployed 2026-07-18, Nepali's FIRST adapter — the
                             # old ne adapter carried the label bug): FLEURS +
                             # IndicVoices-R (cap 20k). 24.34 vs zero-shot 28.46 WER
                             # (n=100 clean); wins ALL 5 degradation conditions
                             # (e.g. bandpass 30.6 vs 34.3, codec 32.0 vs 36.6).
                             # Remove an entry to revert that language to zero-shot.
  temperature: 0.0
  condition_on_previous_text: false
  word_timestamps: true
  vad_filter: false   # VAD already done in Stage 1 (vad_module.py) — no double processing
  vad_parameters:
    threshold: 0.45
    min_speech_duration_ms: 250
    min_silence_duration_ms: 500
  initial_prompt: >
    Military radio communication. Languages include Hindi, Punjabi (Gurmukhi
    and Romanised), Dogri, Urdu, Pashto, Nepali, Kashmiri, Mandarin.
    Punjabi phrases: ਹਾਂ ਜੀ, ਕੀ ਗੱਲ, ਠੀਕ ਹੈ, ਸਾਡੇ, ਤੁਹਾਡੇ.
    Radio callsigns, grid references, tactical orders, unit identifiers.
    Transcribe exactly as spoken.
  initial_prompt_pa: >
    ਫੌਜੀ ਰੇਡੀਓ ਸੰਚਾਰ। ਗੁਰਮੁਖੀ ਲਿਪੀ ਵਿੱਚ ਲਿਖੋ।
    Military radio communication in Punjabi (Gurmukhi script).
    Common phrases: ਹਾਂ ਜੀ, ਨਹੀਂ ਜੀ, ਠੀਕ ਹੈ, ਸਮਝ ਗਿਆ, ਅੱਗੇ ਵਧੋ, ਰੁਕੋ, ਅੱਗੇ, ਪਿੱਛੇ,
    ਕਿੱਥੇ ਹੋ, ਦੱਸੋ, ਖ਼ਬਰ ਕੀ ਹੈ, ਹਮਲਾ, ਫ਼ੌਜ, ਦੁਸ਼ਮਣ, ਸੈਨਿਕ.
    Callsigns, grid references, unit identifiers. Transcribe in Gurmukhi script.

# ── VAD ────────────────────────────────────────────────────────────────────────
vad:
  sampling_rate: 16000
  threshold: 0.30
  min_speech_duration_ms: 250
  min_silence_duration_ms: 600
  speech_pad_ms: 100

# ── Audio preprocessing ────────────────────────────────────────────────────────
preprocessing:
  target_sr: 16000
  normalize: true
  noise_reduce: true
  noise_reduce_stationary: true
  prop_decrease: 0.75        # 0.4 = light · 0.75 = medium · 0.95 = aggressive
  bandpass_filter: true      # restrict to 300–3400 Hz radio telephony bandwidth
  bandpass_low_hz: 300
  bandpass_high_hz: 3400
  trim_silence_db: 20
  clean_snr_threshold: 18.0  # SNR (dB) above which "auto" mode treats audio as clean

# ── Audio quality / stage skipping ──────────────────────────────────────────────
# auto  = decide by SNR (skip denoise/bandpass + diarization when clean)
# clean = force clean path (skip those stages)
# noisy = always run full pipeline
audio_mode: auto

# ── Chunking ───────────────────────────────────────────────────────────────────
chunking:
  max_chunk_duration: 29
  min_chunk_duration: 1.0
  use_vad_segments: true

# ── Language routing ───────────────────────────────────────────────────────────
# NOTE: actual routing is in language_module.py (NLLB_LANGS / INDIC_LANGS sets)
# All Indic langs route via NLLB-200 (IndicTrans2 has DynamicCache incompatibility)
# Exception: doi (Dogri) uses IndicTrans2 (not in NLLB-200 distilled vocab)
language:
  indic_langs:   [doi]
  nllb_langs:    [pa, hi, ur, ne, bn, mai, ks, sd, si, ps, zh, my, bo, fa, ar]   # pa restored 2026-06-23: tokenizer fix makes it output Gurmukhi → NLLB needed
  fallback_route: nllb
  confidence_threshold: 0.60

# ── Translation ────────────────────────────────────────────────────────────────
translation:
  max_input_tokens: 256
  max_output_tokens: 256
  nllb_num_beams: 4        # raised from hardcoded 2 (2026-07-06) — better English
                           # on long sentences, ~1-2 s extra per file on GPU
  unload_after_use: false   # 2026-07-08: keep NLLB cached (was: reload ~4 s/file)
  offload_to_cpu: true      # park fp16 weights in CPU RAM between files,
                            # promote to GPU only for the translation stage
  back_translation: false   # disable to save ~1.2 GB RAM (NLLB loads twice if true)

# ── Memory management ─────────────────────────────────────────────────────────
memory:
  sequential_model_loading: true
  gc_after_each_model: true
  use_mms_lid: true

# ── Diarization ────────────────────────────────────────────────────────────────
diarization:
  enabled: true
  max_speakers: 4     # auto-detect up to this many; 2 is typical for radio intercepts
  cross_file_reid: false   # VOICE_XXX matching across files — disabled 2026-07-06:
                           # MFCC cosine is not speaker-discriminative (77% false-match);
                           # needs ECAPA/x-vector embeddings before re-enabling

# ── ISUM ───────────────────────────────────────────────────────────────────────
isum:
  enabled: true
  model: ollama        # priority: ollama (gemma3) → qwen → rule_based
  ollama_model: gemma3:4b   # 2026-07-08 A5 eval: matched 12b threat/5W on 3 cases
                            # at ~2x speed; rollback = gemma3:12b (still installed)
  ollama_url: http://localhost:11434
  max_summary_sentences: 4
  # Speed knobs (2026-07-08). keep_alive 0 = unload Gemma after each reply
  # (12b resident would starve Seamless/Whisper on the 8 GB card).
  ollama_keep_alive: 0
  num_predict: 320          # was hardcoded 512; ISUM JSON rarely needs >300 tokens
  transcript_chars: 600     # prompt truncation (was 1200)
  translation_chars: 600    # prompt truncation (was 800)

# ── Database ───────────────────────────────────────────────────────────────────
database:
  enabled: true
  store_segments: true
  store_words: false        # set true on lab server (large storage)

# ── 3-node LAN integration (NODE-C orchestrator) ────────────────────────────────
# All remote work is strictly additive and behind flags. With enabled:false the
# pipeline behaves EXACTLY as before. With enabled:true + fallback_on_error:true,
# any unreachable/failed node silently falls back to the local stage, so the
# working demo path cannot regress. See integration/INTEGRATION_PLAN.md.
remote:
  enabled: true              # DEMO 2026-07-10: 3-node LAN live. Boots in Auto mode → probes
                             # A/B, uses them if reachable, else runs local. Set false for standalone.
  fallback_on_error: true    # any remote failure -> run the existing local stage
  timeout_connect_s: 5

  denoise_diarize:           # NODE-A (Gaurav)
    enabled: true
    url: http://192.168.10.11:8801
    timeout_s: 180
    variant: robust          # clean | robust — NOT interchangeable (plan §5.3)
    mode: diarization-guided # | blind (blind is hard-capped at 2 speakers)
    call_on_clean: false     # skip the round trip when VANI's SNR gate says clean
    use_mixed_track: true    # Phase 1. false -> per-speaker ASR (Phase 2, not yet)

  lid:                       # NODE-B (Sanket)
    enabled: true
    url: http://192.168.10.12:8802
    timeout_s: 30
    per_speaker: true
    min_confidence: 0.60     # below this, defer to local MMS-LID
    windows: 3               # >10 s tracks: N windows, client-side prob averaging
